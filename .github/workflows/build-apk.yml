name: Build SGI Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SGI-v1.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SGI-Mobile-App-APK
          path: android/app/build/outputs/apk/debug/SGI-v1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0-app
          name: "SGI Mobile App v1.0"
          body: |
            ### 📱 SGI & LEAP Mobile App for Android
            
            - **Live Server URL:** https://tgsgi.onrender.com/
            - **Direct Download:** Download `SGI-v1.0.apk` below and install on any Android phone.
            - **Updates:** All website updates, attendance, CAT marks, and LEAP changes sync automatically inside the app!
          files: android/app/build/outputs/apk/debug/SGI-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
