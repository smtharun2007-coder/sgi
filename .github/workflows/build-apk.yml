name: Build SGI Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.2 --distribution-type bin
          chmod +x gradlew

      - name: Build Android APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SGI-v1.1.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SGI-Mobile-App-APK
          path: android/app/build/outputs/apk/debug/SGI-v1.1.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1-app
          name: "SGI Mobile App v1.1 (Push Notifications)"
          body: |
            ### 📱 SGI & LEAP Mobile App v1.1 with System Push Notifications
            - **Live Server:** https://tgsgi.onrender.com/
            - **System Notifications:** Full Android system tray & heads-up notifications (like WhatsApp).
            - **Firebase Cloud Messaging:** Connected to Firebase project `tgsgi-2f41f`.
            - Download `SGI-v1.1.apk` and install on any Android phone.
          files: android/app/build/outputs/apk/debug/SGI-v1.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
